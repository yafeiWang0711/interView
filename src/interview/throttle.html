<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    Throttle
    <button id="btn">提交</button>
</body>
<script>
    let btn = document.getElementById('btn')
    function handle() {
        console.log('点击了提交，向后端发送数据')
    }
    btn.addEventListener('click', throttle(handle, 2000))

    function throttle(fn, delay) {
        let timeout = null
        let pre = 0
        return function (...args) {
            const now = Date.now()
            // 如果超过时间间隔
            if(now-pre>delay){
                pre = now
                fn.apply(this,args)
            }else{
                if(timeout){
                    clearTimeout(timeout)
                    timeout = null
                }
                timeout = setTimeout(()=>{
                    pre= now
                    fn.apply(this,args)
                },delay)
            }
        }
    }

</script>

</html>
