<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css selector</title>
</head>

<body>
    <div id="id_selector">id选择器</div>
    <div class="class_selector">类选择器</div>
    <p>标签选择器</p>

</body>
<style>
    #id_selector {
        /* id选择器 */
        width: 200px;
        height: 100px;
        background-color: aqua;
    }
    .class_selector{
        width: 200px;
        height: 100px;
        background-color: azure;
    }
    p{
        font-size: 20px;
        line-height: 20px;
        color: rgb(21, 82, 225);
    }



    /* 
    css 选择器的优先级权重
    1. !important 最高权重  10000
    2. 内联样式 style = “” 1000
    3. ID选择器 id = ‘’ 100
    4. 类选择器 class = ’‘ 10
    5. 标签选择器 p h1 ... 1
    */
</style>

</html>
