<style>
    .parents{
        display: flex;
        width: 800px;
        height: 800px;
        background-color: aqua;
        /* flex-direction: column;  */
        /* 
        flex-direction 决定主轴方向
         row 默认值 水平方向，从左到右
         row-reverse 水平方向，从右到左 
         column 垂直排列，从上到下 
         column-reverse 垂直排列，从下往上
        */

        /* justify-content: space-evenly; */
        /* 
        justify-content 主轴对其方式
            flex-start 默认值 左对齐
            flex-end 右对齐
            center 居中
            space-between 两端对齐 中间项目之间的距离一样
            space-around 项目与项目之间的距离是项目与容器边缘的距离的一半
            space-evenly 项目与项目之间的距离是项目与容器边缘的距离的一致
        */

        /* align-items: baseline; */
        /* 
        align-items 交叉轴对齐方式
            stretch 默认值 项目未设置高度
            flex-start 交叉轴起点对齐
            flex-end 交叉轴终点对齐
            center 居中
            baseline 项目中第一行的文字基线对齐
        */

        flex-wrap: wrap;
        /* 
        flex-wrap 是否换行
            nowrap 不换行 超过宽度可能会导致溢出
            wrap 换行
            wrap-reverse 向上换行
        */

        align-content: space-evenly;
        /* align-content 多行项目的交叉轴 对齐方式，只有一行不生效，
         按照轴来说的
          生效条件
           flex-wrap: wrap;
            flex-start 默认值 左对齐
            flex-end 右对齐
            center 居中
            space-between 两端对齐 中间项目之间的距离一样
            space-around 项目与项目之间的距离是项目与容器边缘的距离的一半
            space-evenly 项目与项目之间的距离是项目与容器边缘的距离的一致
        
        */

        /* gap 项目间距  同时设置行和列*/
        gap: 10px;

        row-gap: 20px; 
        /* row-gap  设置行之间的*/

        column-gap: 20px;
        /* column-gap  设置列之间的*/
    }
    .child1{
        width: 200px;
        height: 200px;
    }
       .child2{
        width: 300px;
        height: 200px;
        order: 1;
        /* order 项目的排列顺序，默认为0 数值越小越靠前 */
        /* flex-grow: 2; */
        /* flex-grow 放大比例 */
        flex-shrink: 4;
        /* flex-shrink 项目定义缩小比例 */
        /* flex-basis 设置项目的初始尺寸 */
        /* flex-self 覆盖容器的align-items的设置 */
    }

       .child3{
        width: 150px;
        height: 150px;
    }


</style>
