<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>display</title>
</head>
<body>
    <h1>display</h1>
    <h4>display:nono 完全不显示，且不占据文档流</h3>
    <div class="boxC boxC1">1</div>
    <h4>display:block 块级元素  单独占据一行 可以设置宽高，前后自动换行 可以将行内元素变为块级元素</h4>
    <div class="boxC boxC2">2
        <span class=""></span>
        2
    </div>
    <h4>display:inline 行内元素  不占据一行 不能设置宽高其宽高由内容决定，可以将块级元素变为行内元素</h4>
    <div class="boxC boxC3">
        <div>2123</div>
        <div>2234</div>
    </div>
     <h4>display:inline-block 行内块元素  不占据一行 可以设置宽高，结合inline和block的特效</h4>
    <div class="boxC boxC4">
        <div>div</div>
        <span>span</span>
    </div>
    <div class="boxC boxC5">5</div>
    <div class="boxC boxC6">6</div>
    <div class="boxC boxC7">7</div>
    <div class="boxC boxC8">8</div>


</body>

<style>
    .boxC{
        width: 100%;
        height: 100px;
        background-color: antiquewhite;
        border: 1px solid #000;
    }
    .boxC1{
        display: none;
    }
    .boxC2 span{
        display: block;
        width: 50px;
        height: 50px;
        background-color: aliceblue;
    }
    .boxC3 div{
        display: inline;
        background-color: aliceblue;
    }
    .boxC4 span,div{
        display: inline-block;
        width: 100px;
        height: 50px;
background-color: aqua;
    }
</style>
</html>
