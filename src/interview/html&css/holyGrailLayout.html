<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>圣杯布局</title>
</head>

<body>
    <h1>1.传统浮动+负边距</h1>

    <div class="wrap">
        <div class="content">content 宽度自适应</div>
        <div class="left">left 宽度固定</div>
        <div class="right">right 宽度固定</div>
    </div>


    <h1>2.flex box实现 flex布局+弹性盒子</h1>
    <div class="wrap1">
        <div class="content1">content 宽度自适应</div>
        <div class="left1">left 宽度固定</div>
        <div class="right1">right 宽度固定</div>
    </div>


    <h1>3.Grid 实现</h1>
    <div class="wrap2">
        <div class="left2">left 宽度固定</div>
        <div class="content2">content 宽度自适应</div>
        <div class="right2">right 宽度固定</div>
    </div>


    <h1>双飞翼布局</h1>
    <div class="wrap3">
        <div class="content3">
            <div class="content_inner">content 宽度自适应</div>
        </div>
        <div class="left3">left 宽度固定</div>
        <div class="right3">right 宽度固定</div>
    </div>
<h2>324</h2>
</body>
<style>
    /* 圣杯布局： 把左中右三部分放在一个大元素中，把三个元素都变成浮动元素，给大容器设置一个 左右的padding 使用relatvie布局 移动 左右元素 */
    /* 双飞翼布局 在圣杯的基础上，在中间元素里面嵌套一个盒子，把left right 浮动 移动，给middle加一个padding 来给左右留位置 */

    * {
        padding: 0px;
        margin: 0px;
    }

    /* 1. 传统浮动 + 负边距 */
    .wrap {
        padding: 0 200px
    }

    .content {
        float: left;
        width: 100%;
        background-color: aqua;
        height: 200px;

    }

    .left {
        float: left;
        width: 200px;
        height: 200px;
        background-color: bisque;
        margin-left: -100%;
        position: relative;
        left: -200px;
    }

    .right {
        float: left;
        width: 200px;
        height: 200px;
        background-color: bisque;
        margin-left: -200px;
        position: relative;
        right: -200px;
    }

    .wrap::after {
        content: "";
        display: table;
        clear: both;
    }


    /* 2. felx box 实现 */
    .wrap1 {
        display: flex;
    }

    .content1 {
        flex: 1;
        height: 100px;
        background-color: aqua;
    }

    .left1 {
        order: -1;
        height: 100px;
        width: 200px;
        background-color: rgb(96, 104, 104);
    }

    .right1 {
        height: 100px;
        width: 200px;
        background-color: rgb(96, 104, 104);
    }

    /* 3. gris 实现 */
    .wrap2 {
        display: grid;
        grid-template-columns: 200px auto 200px;
    }

    .left2 {
        grid-column: 1;
    }

    .content2 {
        grid-column: 2;
        height: 100px;
        background-color: blanchedalmond;
    }

    .right2 {
        grid-column: 3;
    }

    .right2,
    .left2 {
        height: 100px;
        background-color: rgb(96, 104, 104);
    }

    .content3 {
        float: left;
        width: 100%;
        height: 100px;
        background-color: rgb(44, 107, 107);
    }

    .content_inner {
        margin: 0 210px;
    }

    .left3 {
        float: left;
        width: 200px;
        height: 100px;
        background-color: aqua;
        margin-left: -100%;
    }

    .right3 {
        float: left;
        width: 200px;
        height: 100px;
        margin-left: -200px;
        background-color: aqua;
    }
</style>

</html>
